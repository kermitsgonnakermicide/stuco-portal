# docker-compose.yml - local/demo deployment of the Events Portal.
#
#   docker-compose up --build
#
# App:      http://localhost:3000
# Login:    admin@snseventsportal.example  (password printed once in
#           `docker-compose logs web` by the seeder - rotate on first login)
#
# DEMO CREDENTIALS ONLY: the values below (and any ${VAR:-default} fallback)
# are fine for a laptop stack. For anything internet-reachable, set real
# secrets in a .env file next to this compose file (see .env.docker.example)
# and put Postgres/Redis on a private network behind TLS per ARCHITECTURE.md.

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: events-db
    environment:
      POSTGRES_DB: events_portal
      POSTGRES_USER: ${POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-events} -d events_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: events-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: events-portal
    container_name: events-web
    depends_on:
      - db
      - redis
    environment:
      # Local compose DB has no TLS - sslmode intentionally omitted here.
      # Hosted deployments MUST use ?sslmode=require (see .env.example).
      DATABASE_URL: postgresql://${POSTGRES_USER:-events}:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/events_portal
      REDIS_URL: redis://redis:6379
      AUDIT_IP_PEPPER: ${AUDIT_IP_PEPPER:-demo-ip-pepper-change-me-0123456789abcdef}
      CSRF_PUBLIC_SECRET: ${CSRF_PUBLIC_SECRET:-demo-csrf-secret-change-me-0123456789abcdef}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@snseventsportal.example}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-shivnadar-events-media}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
